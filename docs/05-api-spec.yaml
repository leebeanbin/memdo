        - ai.calendar.time
        - ai.calendar.title
        - ai.calendar.note
        - ai.history
        - news.personalization
        - calendar.read
        - calendar.write
    ConsentGrantInput:
      type: object
      required: [scope, policyVersion]
      properties:
