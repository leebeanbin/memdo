    CalendarEntry:
      type: object
      required: [id, entryKind, sourceProvider, sourceLabel, ownership, title, isAllDay, startAt, endAt, resourceUrl]
      properties:
        id: { type: string, format: uuid }
        entryKind:
          type: string
          enum: [event, task, external_event, proposal]
