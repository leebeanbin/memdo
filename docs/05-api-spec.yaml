        displayName: { type: string }
        color: { type: [string, 'null'] }
        visible: { type: boolean, default: true }
        accessLevel:
          type: string
          enum: [free_busy, events_read, events_write]
        syncStatus:
          type: string
          enum: [pending, active, reauthorization_required, revoking, revoked, error]
