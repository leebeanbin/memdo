          enum: [memdo, google_calendar, apple_eventkit]
        sourceLabel: { type: string }
        calendarId: { type: [string, 'null'], format: uuid }
        calendarLabel: { type: [string, 'null'] }
        ownership:
          type: string
          enum: [owned, mirrored, proposed]
        title: { type: string }
        isAllDay: { type: boolean }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        dueAt: { type: [string, 'null'], format: date-time }
