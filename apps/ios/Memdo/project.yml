name: Memdo
options:
  bundleIdPrefix: com.memdo
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    TARGETED_DEVICE_FAMILY: "1"
targets:
  Memdo:
    type: application
    platform: iOS
    sources:
      - Memdo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.memdo.ios
        PRODUCT_NAME: Memdo
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Memdo/Info.plist
    dependencies:
      - target: MemdoWidget
        embed: true
  MemdoWidget:
    type: app-extension
    platform: iOS
    sources:
      - MemdoWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.memdo.ios.widget
        PRODUCT_NAME: MemdoWidget
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: MemdoWidget/Info.plist
schemes:
  Memdo:
    build:
      targets:
        Memdo: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  MemdoWidget:
    build:
      targets:
        MemdoWidget: all
        Memdo: all
    run:
      config: Debug
      executable: Memdo
    profile:
      config: Release
      executable: Memdo
    analyze:
      config: Debug
    archive:
      config: Release
