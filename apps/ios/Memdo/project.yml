name: Memdo
options:
  bundleIdPrefix: com.memdo
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    TARGETED_DEVICE_FAMILY: "1"
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.46.0
targets:
  Memdo:
    type: application
    platform: iOS
    sources:
      - path: Memdo
        excludes:
          - Config.xcconfig
          - Config.xcconfig.local
    configFiles:
      Debug: Memdo/Config.xcconfig
      Release: Memdo/Config.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.memdo.ios
        PRODUCT_NAME: Memdo
        CODE_SIGN_ENTITLEMENTS: Memdo/Memdo.entitlements
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Memdo/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: Supabase
      - target: MemdoWidget
        embed: true
  MemdoWidget:
    type: app-extension
    platform: iOS
    sources:
      - MemdoWidget
      - Memdo/MemdoWidgetSchedule.swift
      - Memdo/MemdoLiveActivity.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.memdo.ios.widget
        PRODUCT_NAME: MemdoWidget
        CODE_SIGN_ENTITLEMENTS: MemdoWidget/MemdoWidget.entitlements
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: MemdoWidget/Info.plist
  MemdoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - MemdoTests
    dependencies:
      - target: Memdo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.memdo.ios.tests
schemes:
  Memdo:
    build:
      targets:
        Memdo: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MemdoTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  MemdoWidget:
    build:
      targets:
        MemdoWidget: all
        Memdo: all
    run:
      config: Debug
      executable: Memdo
    profile:
      config: Release
      executable: Memdo
    analyze:
      config: Debug
    archive:
      config: Release
