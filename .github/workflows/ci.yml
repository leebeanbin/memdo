name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    defaults:
      run:
        working-directory: apps/ios/Memdo
    steps:
      - uses: actions/checkout@v4

      - name: Select newest available Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)/Contents/Developer"

      - run: brew install xcodegen

      - run: xcodegen generate

      - name: Pick a simulator
        run: |
          UDID=$(xcrun simctl list devices available -j \
            | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; \
              print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if 'iPhone' in x['name']))")
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"

      - name: Build
        run: >
          xcodebuild build -project Memdo.xcodeproj -scheme Memdo
          -destination "platform=iOS Simulator,id=$SIM_UDID"
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Test
        run: >
          xcodebuild test -project Memdo.xcodeproj -scheme Memdo
          -destination "platform=iOS Simulator,id=$SIM_UDID"
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
